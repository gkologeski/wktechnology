name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded commits do not occupy a runner; PR and main have distinct groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Full verification and performance
    # Native Linux ARM64 matches the pinned database images validated locally.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use a consistent Node runtime
        id: node-runtime
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Restore content-based lint results
        id: lint-cache
        uses: actions/cache/restore@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-runtime.outputs.node-version }}-eslint-${{ hashFiles('bun.lock', 'eslint*.config.*', 'eslint-rules/**', '.prettierrc*', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-runtime.outputs.node-version }}-eslint-${{ hashFiles('bun.lock', 'eslint*.config.*', 'eslint-rules/**', '.prettierrc*', '.prettierignore') }}-
      - name: Permission contracts and denial evidence
        run: bun run permissions:check
      - name: Official help coverage
        run: bun run help:coverage
      # Download the locked database dependency before timed verification.
      # Every suite still creates its own disposable database and executes all SQL.
      - name: Prepare pinned database test images
        run: |
          docker pull postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          docker pull postgrest/postgrest@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
      - name: Report verification resources
        run: node -e 'const os=require("node:os"); console.log(JSON.stringify({cpus:os.availableParallelism(),arch:os.arch(),memoryMiB:Math.round(os.totalmem()/1048576)}))'
      - run: bun run verify
        id: verify
        # Bound both runtimes while native types and disposable SQL suites overlap.
        env:
          GOMAXPROCS: "2"
          VITEST_MAX_WORKERS: "5"
      # Verified lint data remains useful when a later build/performance check fails.
      # Never cache release evidence, test outcomes or build outputs.
      - name: Save verified content-based lint results
        uses: actions/cache/save@v4
        with:
          path: .eslintcache
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
      - run: bun run build
      - run: bun run perf:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: performance-verification
          path: .verification/
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    # Homologação autenticada é opt-in; sem configuração não vira um job verde com skips.
    if: ${{ vars.E2E_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Use a consistent Node runtime
        id: node-runtime
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Require explicit homologation configuration
        run: |
          test -n "$E2E_USER_EMAIL" && test -n "$E2E_USER_PASSWORD" && test -n "$E2E_BASE_URL" || { echo "Authenticated E2E is incomplete: configure account and explicit homologation URL."; exit 1; }
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
