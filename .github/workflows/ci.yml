name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Full verification and performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Permission contracts and denial evidence
        run: bun run permissions:check
      - run: bun run verify
      - run: bun run build
      - run: bun run perf:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: performance-verification
          path: .verification/
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    # Homologação autenticada é opt-in; sem configuração não vira um job verde com skips.
    if: ${{ vars.E2E_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Require explicit homologation configuration
        run: |
          test -n "$E2E_USER_EMAIL" && test -n "$E2E_USER_PASSWORD" && test -n "$E2E_BASE_URL" || { echo "Authenticated E2E is incomplete: configure account and explicit homologation URL."; exit 1; }
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
