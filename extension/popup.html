<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TechHire Hunter</title>
    <style>
      body {
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 14px;
        width: 300px;
        color: #0f172a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #475569;
        margin: 8px 0 4px;
      }
      input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 6px 8px;
        font: inherit;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        margin-top: 12px;
        background: #0f172a;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #475569;
      }
      .ok {
        color: #15803d;
      }
      .err {
        color: #b91c1c;
      }
      .muted {
        color: #94a3b8;
        font-size: 11px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>TechHire Hunter</h1>
    <label for="apiBase">URL do TechHire</label>
    <input id="apiBase" placeholder="https://app.lovable.app" />
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="lvb_...." />
    <button id="save">Salvar e parear</button>
    <div id="status" class="status"></div>
    <p class="muted">Gere uma API key em <i>Configurações · API keys</i> dentro do TechHire.</p>
    <script src="popup.js"></script>
  </body>
</html>
